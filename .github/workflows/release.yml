name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  goreleaser:
    if: ${{ github.repository == 'waonme/activitypub' && github.repository_owner == 'waonme' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install release guard dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate fork release destination
        run: node --import tsx scripts/check-release-target.ts github

      # `pnpm install --prod` and the version stamping run as goreleaser
      # before-hooks (see .goreleaser.yaml)
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
